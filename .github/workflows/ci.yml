name: Deterministic engine
on: [push, pull_request]
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCREATURE_VIEWER=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
  viewer-and-ffi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - run: make all test
      - run: SDL_VIDEODRIVER=dummy ./build/creature_lab --frames 3
      - run: c++ -std=c++17 -O1 -g -fsanitize=address,undefined -Iinclude src/sim.cpp tests/sim_tests.cpp -o build/sanitized && ./build/sanitized
